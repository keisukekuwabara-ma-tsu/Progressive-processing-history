<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>順送プレス加工実績入力</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<style>
:root{--bg:#eef2f6;--card:#fff;--tx:#0f172a;--sub:#475569;--ac:#0369a1;--acl:#e0f2fe;--bd:#cbd5e1;--ok:#15803d;--okl:#dcfce7;--ng:#b91c1c;--ngl:#fee2e2;--wn:#b45309;--wnl:#fef3c7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--tx);margin:0;padding:12px 12px 60px;display:flex;flex-direction:column;align-items:center;font-size:17px}
.container,.history-container{width:100%;max-width:560px}
.container{background:var(--card);padding:20px;border-radius:18px;margin-bottom:22px;box-shadow:0 2px 10px rgba(15,23,42,.1)}
h2{text-align:center;margin:0 0 18px;font-size:1.4rem;color:var(--ac)}
.step{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;margin:6px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--acl)}
.num{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;align-items:center;justify-content:center;font-size:1rem}
.fg{margin-bottom:18px}
.fl{display:block;margin-bottom:8px;font-size:1rem;color:var(--sub);font-weight:700}
input[type=text],input[type=number],select{width:100%;height:56px;padding:0 14px;background:#fff;border:2px solid var(--bd);border-radius:12px;color:var(--tx);font-size:1.2rem}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--acl)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{height:64px;border:2px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx);font-size:1.4rem;font-weight:800;cursor:pointer}
.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0}
.scan-btn,.confirm-btn{height:56px;border:none;border-radius:12px;color:#fff;font-weight:800;cursor:pointer}
.scan-btn{width:64px;background:#f59e0b;font-size:1.5rem}
.confirm-btn{padding:0 22px;background:var(--ac);font-size:1.15rem}
.stagebadge{display:inline-block;padding:6px 16px;border-radius:999px;background:var(--acl);color:var(--ac);font-weight:800;margin-bottom:14px}
.defect{margin-top:12px;background:var(--wnl);border-left:6px solid #f59e0b;border-radius:8px;padding:12px 14px;display:none;line-height:1.5}
.defect b{color:var(--wn);display:block;margin-bottom:4px}
#measured{height:72px;font-size:2rem;text-align:center;font-weight:800}
.target-val{display:block;color:var(--wn);font-size:.95rem;margin-top:4px;font-weight:700}
.judge{padding:14px;border-radius:12px;text-align:center;font-weight:900;font-size:1.7rem;margin-top:12px;display:none}
.ok{background:var(--okl);color:var(--ok);border:3px solid var(--ok)}
.ng{background:var(--ngl);color:var(--ng);border:3px solid var(--ng)}
.submit-btn{width:100%;height:64px;background:var(--ok);border:none;border-radius:14px;color:#fff;font-size:1.3rem;font-weight:800;cursor:pointer;position:sticky;bottom:12px;z-index:5;box-shadow:0 6px 16px rgba(21,128,61,.4)}
.submit-btn:active{transform:scale(.98)}
.submit-btn:disabled{background:#94a3b8!important;box-shadow:none}
#message{position:fixed;top:10px;left:12px;right:12px;max-width:560px;margin:0 auto;z-index:10000;padding:14px;border-radius:12px;text-align:center;font-weight:700;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25);line-height:1.5}
.success{background:var(--ok);color:#fff}.error{background:var(--ng);color:#fff}
.hidden{display:none!important}
.htitle{font-size:1.15rem;font-weight:800;border-left:6px solid var(--ac);padding-left:10px}
.hcard{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;position:relative;border-left:8px solid var(--ok);box-shadow:0 1px 6px rgba(15,23,42,.1)}
.hcard.inc{border-left-color:#f59e0b;background:#fffbeb}
.hcard::before{content:"完了";position:absolute;top:12px;right:12px;padding:3px 12px;border-radius:999px;background:var(--okl);color:var(--ok);font-weight:800;font-size:.85rem}
.hcard.inc::before{content:"作業中";background:var(--wnl);color:var(--wn)}
.hcard.choko::after{content:"⚠️ チョコ停";position:absolute;top:12px;right:78px;padding:3px 10px;border-radius:999px;background:var(--ngl);color:var(--ng);font-weight:800;font-size:.85rem}
.choko-info{margin-top:10px;font-size:.95rem;color:var(--ng);background:var(--ngl);border-radius:8px;padding:8px 12px;line-height:1.5}
.ctop{margin-bottom:10px;padding-right:130px}
.ctitle{font-size:1.25rem;font-weight:900}
.cmeta{font-size:.95rem;color:var(--sub);margin-top:4px;display:flex;gap:4px 14px;flex-wrap:wrap}
.cmeta b{color:var(--tx)}
.tl{display:flex;flex-direction:column;gap:8px}
.tr{background:#f8fafc;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.sl{font-weight:900;min-width:52px;padding:4px 0;border-radius:8px;text-align:center;font-size:.95rem;color:#fff}
.l始{background:#0369a1}.l中{background:#d97706}.l終{background:var(--ok)}
.sv{flex:1;display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:600;min-width:0}
.st{font-size:.85rem;color:var(--sub);white-space:nowrap}
.edit-link{margin-left:auto;height:40px;padding:0 14px;background:var(--acl);border:none;border-radius:8px;color:var(--ac);font-weight:800;font-size:.95rem;cursor:pointer}
.sf{display:none;flex:1 1 100%;gap:8px;align-items:center;flex-wrap:wrap}
.sf select,.sf input{width:auto;height:44px;padding:0 8px;font-size:1rem;border-radius:8px}
.sf input[type=number]{width:80px}
.qty{margin-top:10px;background:var(--acl);border-radius:8px;padding:10px 14px;font-weight:800;font-size:1.1rem}
.cb{height:48px;padding:0 16px;background:var(--ac);color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:1rem;white-space:nowrap}
.cb.sm{height:44px;padding:0 14px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:9999;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .15s}
.overlay.show{opacity:1;pointer-events:auto}
.spinner{width:52px;height:52px;border:6px solid #fff;border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#chokoModal{align-items:flex-end}
#chokoModal .container{max-width:600px;margin:0;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
#warn{position:fixed;inset:0;background:rgba(220,38,38,.98);z-index:100000;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;color:#fff}
#warn h1{font-size:2.2rem;margin:0 0 20px}#warn p{font-size:1.2rem;line-height:1.6;margin-bottom:30px}
#warn button{padding:16px 48px;background:#fff;color:#dc2626;border:none;border-radius:50px;font-weight:800;font-size:1.2rem}
body.so{overflow:hidden}
#scan{position:fixed;inset:0;height:100dvh;background:#000;z-index:99999;display:none;flex-direction:column}
#sh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:#111;color:#fff}
#sh h3{margin:0;color:#58a6ff;font-size:1rem;flex:1}
#sh button{background:#ef4444;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer}
#pc{flex:1;min-height:0;position:relative;overflow:hidden}
#preview{position:absolute;inset:0}
#preview video{position:absolute!important;inset:0;width:100%!important;height:100%!important;object-fit:cover;transform:none!important}
#preview canvas{display:none!important}
#guide{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80%;max-width:480px;aspect-ratio:2/1;border:3px dashed #0f0;border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);z-index:5;pointer-events:none;overflow:hidden}
#line{position:absolute;left:0;width:100%;height:2px;background:#ff375f;box-shadow:0 0 15px #ff375f;animation:sm 1.5s ease-in-out infinite alternate}
@keyframes sm{0%{top:8%}100%{top:92%}}
#sf2{background:#111;padding:12px 16px calc(12px + env(safe-area-inset-bottom));text-align:center;color:#f59e0b;font-weight:700}
@media(min-width:768px){.container,.history-container{max-width:600px}}
</style>
</head>
<body>

<div id="warn">
  <h1>⚠️ 未完了の作業があります</h1>
  <p>前日以前の履歴で「終」まで完了していないデータがあります。<br>まず履歴を確認してください。</p>
  <button type="button" onclick="closeWarn()">確認しました</button>
</div>
<div id="loading" class="overlay"><div class="spinner"></div></div>

<div id="scan">
  <div id="sh"><h3>枠内にバーコードを写してください</h3>
    <button id="torchBtn" onclick="toggleTorch()" style="display:none;background:#f59e0b">💡 ライトON</button>
    <button type="button" onclick="stopScan()">閉じる</button></div>
  <div id="pc"><div id="preview"></div><div id="guide"><div id="line"></div></div></div>
  <div id="sf2"><span id="scanStatus">カメラを起動中...</span></div>
</div>

<div class="container">
  <h2>順送プレス加工実績入力</h2>
  <form id="pressForm" onkeydown="return event.key!='Enter'">
    <div class="step"><span class="num">1</span>作業者・機械</div>
    <div class="fg"><label class="fl" for="worker">作業者</label>
      <select id="worker" required><option value="">選択してください</option></select></div>
    <div class="fg"><span class="fl">使用する機械</span>
      <div class="seg" id="seg">
        <button type="button" data-m="順送【80ｔ】">80t</button>
        <button type="button" data-m="順送【110ｔ】">110t</button>
        <button type="button" data-m="順送【200ｔ】">200t</button>
      </div>
      <select id="machine" class="hidden">
        <option value="">選択してください</option>
        <option value="順送【80ｔ】">順送【80ｔ】</option>
        <option value="順送【110ｔ】">順送【110ｔ】</option>
        <option value="順送【200ｔ】">順送【200ｔ】</option></select></div>

    <div class="step"><span class="num">2</span>コイルNo</div>
    <div class="fg">
      <div class="row">
        <input type="text" id="coilNo" list="coilList" required placeholder="入力 / 📷 / 一覧から選択" autocomplete="off" autocapitalize="characters">
        <button type="button" class="scan-btn" onclick="startScan()">📷</button>
        <button type="button" class="confirm-btn" onclick="onCoil()">確定</button>
      </div>
      <datalist id="coilList"></datalist></div>

    <div id="dyn" class="hidden">
      <div class="step"><span class="num">3</span>計測・記録</div>
      <div id="stageBadge" class="stagebadge"></div>
      <div class="fg"><label class="fl" for="productName">該当品名</label>
        <select id="productName" required></select>
        <div id="defect" class="defect"></div></div>
      <div class="fg"><label class="fl" for="measured">実寸計測値 (mm)<span id="tgt" class="target-val"></span></label>
        <input type="number" id="measured" step="0.1" inputmode="decimal" required placeholder="0.0">
        <div id="judge" class="judge"></div></div>
      <div id="qtyField" class="fg hidden"><label class="fl" for="quantity">加工数量 (個) ※今回の送信で加工終了</label>
        <input type="number" id="quantity" inputmode="numeric" placeholder="数量を入力"></div>
      <button type="submit" id="submitBtn" class="submit-btn">実績を送信</button>
    </div>
  </form>
</div>
<div id="message"></div>

<div class="history-container">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div class="htitle">直近10件の品名別加工履歴</div>
    <button type="button" class="cb" style="padding:4px 10px;font-size:.8rem;background:#262936;border:1px solid #334155" onclick="load(true)">🔄 更新</button>
  </div>
  <div id="hist"><div style="text-align:center;color:#666;padding:20px">履歴データを読み込み中...</div></div>
</div>

<div id="chokoModal" class="overlay">
  <div class="container">
    <h3 style="color:var(--wn);text-align:center;margin:0 0 16px">⚠️ チョコ停の記録</h3>
    <div class="fg"><label class="fl">原因を選択</label>
      <select id="chokoReason">
        <option>ミスフィード</option><option>材料反り送り異常（ミスフィード）</option>
        <option>金型詰まり</option><option>ピアスカス詰まり</option><option>その他</option></select>
      <input type="text" id="otherReason" placeholder="その他の内容を入力" class="hidden" style="margin-top:10px"></div>
    <div class="fg"><label style="font-weight:800;display:flex;align-items:center;gap:12px;min-height:48px">
      <input type="checkbox" id="boxCheck" style="width:28px;height:28px"> 箱チェック完了</label></div>
    <div class="fg"><label class="fl">廃棄数 (個)</label><input type="number" id="wasteQty" inputmode="numeric" placeholder="0"></div>
    <button class="submit-btn" style="background:#d97706;position:static;box-shadow:none" onclick="submitChoko()">記録する</button>
    <button class="cb" style="background:#64748b;width:100%;margin-top:12px;height:56px;font-size:1.1rem" onclick="closeChoko()">キャンセル</button>
  </div>
</div>

<script>
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyKuZhZb_aOg7Iyb2YTYHOwOMKognF57OpGuzmPJxNfo2dpa-F81j-iI5yuRVDqaidvRg/exec";
const CK = 'ppInitV2';
const MACHINES = ["順送【80ｔ】", "順送【110ｔ】", "順送【200ｔ】"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');

let logs = [], workers = [], coils = [], products = [], target = null, stage = '始';
let warnDismissed = false, chokoLog = null;
const pcache = {};

// ---------- 通信 ----------
async function api(action, payload = {}, retries = 1, timeout = 15000) {
  for (let a = 0; a <= retries; a++) {
    const ac = new AbortController(), t = setTimeout(() => ac.abort(), timeout);
    try {
      const r = await fetch(GAS_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action, ...payload }), signal: ac.signal });
      const text = await r.text();
      let d;
      try { d = JSON.parse(text); } catch (e) { throw new Error('サーバー応答が不正です'); }
      if (d && d.error) throw new Error(d.error);
      return d;
    } catch (e) {
      if (a >= retries) throw e;
      await new Promise(r => setTimeout(r, 500));
    } finally { clearTimeout(t); }
  }
}

const nowStr = () => { const d = new Date(); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const todayStr = () => nowStr().split(' ')[0];
const logDate = l => ((l.start || l.middle || l.end || {}).time || '').split(' ')[0];
const findToday = (c, p) => logs.find(l => l.coilNo === c && l.productName === p && logDate(l) === todayStr());

function persist() { try { localStorage.setItem(CK, JSON.stringify({ workers, history: logs, coils })); } catch (e) {} }
function applyServer(res) {
  if (res && Array.isArray(res.history)) { logs = res.history; if (res.coils) coils = res.coils; persist(); render(); }
}

// ---------- 初期化 ----------
document.addEventListener('DOMContentLoaded', () => {
  try {
    const c = JSON.parse(localStorage.getItem(CK) || 'null');
    if (c) { workers = c.workers || []; logs = c.history || []; coils = c.coils || []; fillWorkers(); render(); }
  } catch (e) {}
  load(false);
  $('hist').addEventListener('click', onHistClick);
  $('coilNo').addEventListener('keydown', e => { if (e.key === 'Enter') onCoil(); });
  setMachine(pref().machine || ''); $('worker').value = pref().worker || '';
  $('message').addEventListener('click', e => e.currentTarget.style.display = 'none');
  $('worker').addEventListener('change', savePref);
  $('seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; setMachine(b.dataset.m); savePref(); $('coilNo').focus(); });
  $('productName').addEventListener('change', onProduct);
  $('measured').addEventListener('input', judge);
  $('chokoReason').addEventListener('change', e => $('otherReason').classList.toggle('hidden', e.target.value !== 'その他'));
});

async function load(force) {
  try {
    const d = await api('getInit', { includeWorkers: force || !workers.length });
    if (Array.isArray(d.workers)) { workers = d.workers; fillWorkers(); }
    logs = d.history || []; coils = d.coils || [];
    persist();
    if (logs.some(l => l.isWarning) && !warnDismissed) $('warn').style.display = 'flex';
    render();
  } catch (e) {
    if (!logs.length) $('hist').innerHTML = `<div style="text-align:center;color:#f87171;padding:20px">履歴の読み込みでエラーが発生しました<br><small style="color:#94a3b8">${esc(e.message)}</small><br><button class="cb" style="margin-top:12px" onclick="load(true)">🔄 再読み込み</button></div>`;
    else showMsg('通信エラーのため保存済みデータを表示中', true);
  }
}
function closeWarn() { warnDismissed = true; $('warn').style.display = 'none'; }
function fillWorkers() {
  const s = $('worker'), v = s.value;
  s.innerHTML = '<option value="">選択してください</option>' + workers.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join('');
  s.value = v || pref().worker || '';
}
let msgT;
function showMsg(t, err) { const m = $('message'); m.className = err ? 'error' : 'success'; m.textContent = t; m.style.display = 'block'; clearTimeout(msgT); if (!err) msgT = setTimeout(() => m.style.display = 'none', 4000); }
function setMachine(m) { $('machine').value = m; document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.m === m)); }
function pref() { try { return JSON.parse(localStorage.getItem('ppPref') || '{}'); } catch (e) { return {}; } }
function savePref() { try { localStorage.setItem('ppPref', JSON.stringify({ worker: $('worker').value, machine: $('machine').value })); } catch (e) {} }

// ---------- コイル確定 ----------
async function onCoil() {
  const coilNo = $('coilNo').value.trim();
  if (!coilNo) return;
  $('message').style.display = 'none'; $('dyn').classList.add('hidden'); resetJudge();
  $('qtyField').classList.add('hidden'); $('quantity').required = false;
  let res = pcache[coilNo];
  if (!res || Date.now() - res.t > 600000) {
    $('loading').classList.add('show');
    try { const r = await api('getProducts', { coilNo }); if (r.success) pcache[coilNo] = { t: Date.now(), r }; res = { r }; }
    catch (e) { $('loading').classList.remove('show'); return showMsg('通信エラーが発生しました。', true); }
    $('loading').classList.remove('show');
  }
  const r = res.r;
  if (!r.success) return showMsg(r.msg, true);
  products = r.products || [];
  const sel = $('productName');
  sel.innerHTML = (products.length > 1 ? '<option value="">該当複数あり、品名を選択してください▼</option>' : '') +
    products.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
  $('dyn').classList.remove('hidden');
  if (products.length === 1) onProduct(); else sel.focus();
}

function onProduct() {
  const name = $('productName').value, coilNo = $('coilNo').value.trim();
  const sb = $('submitBtn'), df = $('defect');
  $('message').style.display = 'none'; sb.disabled = false; df.style.display = 'none';
  if (!name) { target = null; $('tgt').textContent = ''; resetJudge(); return; }
  const p = products.find(x => x.name === name);
  if (p) {
    target = parseFloat(p.measured);
    $('tgt').textContent = `（基準: ${target.toFixed(1)} / OK範囲: ${(target-0.8).toFixed(1)}～${(target+0.8).toFixed(1)}）`;
    if (p.defect) { df.innerHTML = `<b>⚠️ 過去の不良事例・注意点</b>${esc(p.defect)}`; df.style.display = 'block'; }
  }
  const f = findToday(coilNo, name);
  if (f && f.end) {
    showMsg(`🚨 入力エラー: このコイルにおける「${name}」の加工はすでに【終】まで完了しています。二周目の再加工登録は認められません。`, true);
    sb.disabled = true; return;
  }
  stage = !f ? '始' : f.middle ? '終' : f.start ? '中' : '始';
  $('stageBadge').textContent = '今回の記録：「' + stage + '」' + (stage === '終' ? '（最終）' : '');
  $('qtyField').classList.toggle('hidden', stage !== '終');
  $('quantity').required = stage === '終';
  $('measured').focus(); judge();
}

function judge() {
  const v = $('measured').value.trim(), j = $('judge');
  if (v === '' || target === null) return resetJudge();
  const ok = Math.abs(parseFloat(v) - target) <= 0.8 + 1e-9;
  j.textContent = ok ? '判定：OK' : '判定：NG (許容範囲外)';
  j.className = 'judge ' + (ok ? 'ok' : 'ng'); j.style.display = 'block';
}
function resetJudge() { const j = $('judge'); j.style.display = 'none'; j.textContent = ''; }

// ---------- 保存（先に画面更新 → 裏で送信） ----------
function applyLocal(d) {
  const t = nowStr();
  const data = { time: t, worker: d.worker, measured: d.measured, qty: d.quantity || '' };
  let log = findToday(d.coilNo, d.productName);
  if (log) {
    log.machine = d.machine;
    const cur = log[{ '始': 'start', '中': 'middle', '終': 'end' }[d.enforcedStage]];
    if (d.edit && cur) { data.time = cur.time; }
    log[{ '始': 'start', '中': 'middle', '終': 'end' }[d.enforcedStage]] = data;
    logs = [log, ...logs.filter(l => l !== log)];
  } else {
    log = { row: null, coilNo: d.coilNo, productName: d.productName, machine: d.machine, start: null, middle: null, end: null };
    log[{ '始': 'start', '中': 'middle', '終': 'end' }[d.enforcedStage]] = data;
    logs.unshift(log);
  }
}

function send(d, okText) {
  applyLocal(d); persist(); render();
  showMsg('送信中…（画面は先に更新済みです）');
  api('saveLog', { logData: d }, 1, 20000).then(res => {
    showMsg(`【${res.type}】${okText}`);
    applyServer(res);
  }).catch(e => { showMsg('保存エラー: ' + e.message + ' ／ 履歴を再取得します', true); load(false); });
}

$('pressForm').addEventListener('submit', e => {
  e.preventDefault();
  if ($('judge').classList.contains('ng')) return alert('⚠️ 判定がNGのため、送信できません。');
  if (!$('worker').value || !$('machine').value) return alert('作業者と機械を選択してください。');
  const coilNo = $('coilNo').value.trim(), productName = $('productName').value;
  const f = findToday(coilNo, productName);
  const d = { coilNo, productName, worker: $('worker').value, machine: $('machine').value,
    measured: $('measured').value, enforcedStage: stage, quantity: $('quantity').value, row: f ? f.row : null };
  send(d, '実績ログに登録しました！');
  ['coilNo', 'measured', 'quantity'].forEach(i => $(i).value = '');
  $('qtyField').classList.add('hidden'); $('quantity').required = false;
  $('dyn').classList.add('hidden'); $('tgt').textContent = '';
  products = []; target = null; stage = '始'; resetJudge(); $('coilNo').focus();
});

// ---------- 履歴描画（イベント委譲） ----------
function stageRow(i, st, icon, d, log, qty) {
  const wo = workers.map(w => `<option ${w === d.worker ? 'selected' : ''}>${esc(w)}</option>`).join('');
  const mo = MACHINES.map(m => `<option ${m === log.machine ? 'selected' : ''}>${esc(m)}</option>`).join('');
  const n = parseFloat(d.measured), ml = isNaN(n) ? '-' : n.toFixed(1) + 'mm';
  return `<div class="tr"><span class="sl l${st}">${icon} ${st}</span>
    <div class="sv" id="v-${i}-${st}"><span>👤 ${esc(d.worker)} &nbsp;📐 ${ml}</span>
      <button type="button" class="edit-link" data-act="edit" data-i="${i}" data-s="${st}">✏️ 修正</button></div>
    <div class="sf" id="f-${i}-${st}">
      <select id="em-${i}-${st}">${mo}</select><select id="ew-${i}-${st}">${wo}</select>
      <input type="number" id="ed-${i}-${st}" step="0.1" value="${esc(d.measured || '')}">mm
      ${qty ? `<input type="number" id="eq-${i}-${st}" value="${esc(d.qty || '')}" placeholder="数量">個` : ''}
      <button type="button" class="cb sm" style="background:#10b981" data-act="save" data-i="${i}" data-s="${st}">保存</button>
      <button type="button" class="cb sm" style="background:#64748b" data-act="cancel" data-i="${i}" data-s="${st}">×</button></div>
    <span class="st" id="t-${i}-${st}">${esc((d.time || '').slice(5, 16))}</span></div>`;
}

function render() {
  const el = $('hist');
  if (!logs.length) el.innerHTML = '<div style="text-align:center;color:#666;padding:20px">履歴データがまだありません。</div>';
  else el.innerHTML = logs.slice(0, 10).map((l, i) => {
    const hasC = !!l.chokoReason;
    return `<div class="hcard${l.end ? '' : ' inc'}${hasC ? ' choko' : ''}">
      <div class="ctop"><div class="ctitle">Coil No: ${esc(l.coilNo)}</div>
        <div class="cmeta"><span>Product: <b>${esc(l.productName)}</b></span><span>Machine: <b>${esc(l.machine)}</b></span></div></div>
      <div class="tl">${l.start ? stageRow(i, '始', '▶', l.start, l, false) : ''}${l.middle ? stageRow(i, '中', '🔄', l.middle, l, false) : ''}${l.end ? stageRow(i, '終', '■', l.end, l, true) : ''}</div>
      ${l.end && l.end.qty ? `<div class="qty">📦 Qty: ${esc(l.end.qty)}</div>` : ''}
      ${hasC ? `<div class="choko-info">⚠️ ${esc(l.chokoReason)} ／ 廃棄: ${esc(l.wasteQty || 0)}個 ／ 箱チェック: ${l.boxCheck ? '完了' : '未'}${l.chokoTime ? ' ／ ' + esc(l.chokoTime) : ''}</div>` : ''}
      <button type="button" class="cb" style="width:100%;margin-top:14px;background:#f59e0b" data-act="choko" data-i="${i}">⚠️ チョコ停を記録</button></div>`;
  }).join('');
  $('coilList').innerHTML = [...new Set([...coils, ...logs.filter(l => !l.end).map(l => l.coilNo)])].sort().map(c => `<option value="${esc(c)}">`).join('');
}

function onHistClick(e) {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const i = +b.dataset.i, s = b.dataset.s, act = b.dataset.act;
  if (act === 'edit' || act === 'cancel') {
    const ed = act === 'edit';
    $(`v-${i}-${s}`).style.display = ed ? 'none' : 'flex';
    $(`t-${i}-${s}`).style.display = ed ? 'none' : 'block';
    $(`f-${i}-${s}`).style.display = ed ? 'flex' : 'none';
  } else if (act === 'save') {
    const log = logs[i];
    const d = { coilNo: log.coilNo, productName: log.productName, enforcedStage: s, edit: true, row: log.row,
      machine: $(`em-${i}-${s}`).value, worker: $(`ew-${i}-${s}`).value, measured: $(`ed-${i}-${s}`).value,
      quantity: s === '終' ? $(`eq-${i}-${s}`).value : '' };
    if (!d.worker || !d.measured) return alert('作業者と実寸計測値を入力してください。');
    if (s === '終' && !d.quantity) return alert('加工数量を入力してください。');
    send(d, '修正内容を上書き保存しました！');
  } else if (act === 'choko') {
    chokoLog = logs[i];
    $('chokoReason').value = 'ミスフィード'; $('otherReason').value = ''; $('otherReason').classList.add('hidden');
    $('wasteQty').value = ''; $('boxCheck').checked = false;
    $('chokoModal').classList.add('show');
  }
}

// ---------- チョコ停 ----------
function closeChoko() { $('chokoModal').classList.remove('show'); }
function submitChoko() {
  const sel = $('chokoReason').value;
  const reason = sel === 'その他' ? $('otherReason').value.trim() : sel;
  if (!reason) return alert('その他の理由を入力してください。');
  const log = chokoLog;
  const d = { coilNo: log.coilNo, productName: log.productName, row: log.row, reason,
    wasteQty: parseInt($('wasteQty').value, 10) || 0, boxCheck: $('boxCheck').checked };
  closeChoko();
  Object.assign(log, { chokoReason: reason, wasteQty: d.wasteQty, boxCheck: d.boxCheck, chokoTime: nowStr() });
  persist(); render();
  showMsg('チョコ停を送信中…');
  api('saveChokotei', { logData: d }, 1, 20000).then(res => {
    if (res.status === 'error') { showMsg(res.message, true); return load(false); }
    showMsg(res.status === 'mail_error' ? res.message : 'チョコ停を記録しました', res.status === 'mail_error');
    applyServer(res);
  }).catch(e => { showMsg('エラー: ' + e.message, true); load(false); });
}

// ---------- バーコード ----------
let scanSession = 0, nativeStream = null, nativeTimer = null, torchOn = false, starting = false;
let matchCount = 0, lastCode = '', quaggaOk = false, quaggaP = null;
function loadQuagga() {
  if (window.Quagga) return Promise.resolve();
  if (!quaggaP) quaggaP = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js';
    s.onload = res; s.onerror = () => { quaggaP = null; rej(); };
    document.head.appendChild(s);
  });
  return quaggaP;
}
function startScan() {
  if (starting) return;
  starting = true; setTimeout(() => starting = false, 800);
  try { Quagga.stop(); Quagga.offDetected(); } catch (e) {}
  stopNative();
  document.body.classList.add('so'); $('scan').style.display = 'flex';
  $('scanStatus').textContent = 'スキャン中... 赤い線をバーコードに合わせてください';
  $('torchBtn').style.display = 'none'; torchOn = false;
  scanSession++; matchCount = 0; lastCode = ''; quaggaOk = false;
  if ('BarcodeDetector' in window) nativeScan(scanSession); else quaggaScan();
}
function found(raw) {
  let c = String(raw || '').trim();
  if (!c) return;
  c = (c.replace(/^0+(?=.)/, '') || c).toUpperCase();
  if (c === lastCode) matchCount++; else { lastCode = c; matchCount = 1; }
  if (matchCount >= 2) {
    if (navigator.vibrate) navigator.vibrate(60);
    $('coilNo').value = c; stopScan(); setTimeout(onCoil, 100);
  } else $('scanStatus').textContent = `スキャン中... (${matchCount}/2)`;
}
async function nativeScan(session) {
  try {
    let f = ['code_128', 'code_39', 'ean_13', 'ean_8', 'itf'];
    if (BarcodeDetector.getSupportedFormats) { const sup = await BarcodeDetector.getSupportedFormats(); f = f.filter(x => sup.includes(x)); }
    if (!f.length) throw 0;
    const det = new BarcodeDetector({ formats: f });
    nativeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    if (session !== scanSession) return stopNative();
    const v = document.createElement('video');
    v.setAttribute('playsinline', ''); v.muted = true; v.srcObject = nativeStream;
    $('preview').innerHTML = ''; $('preview').appendChild(v);
    await v.play(); trackExtras();
    const loop = async () => {
      if (session !== scanSession) return;
      try { if (v.readyState >= 2) { const r = await det.detect(v); if (r.length && session === scanSession) found(r[0].rawValue); } } catch (e) {}
      if (session === scanSession) nativeTimer = setTimeout(loop, 50);
    };
    loop();
  } catch (e) { stopNative(); if (session === scanSession) quaggaScan(); }
}
function stopNative() {
  if (nativeTimer) { clearTimeout(nativeTimer); nativeTimer = null; }
  if (nativeStream) { nativeStream.getTracks().forEach(t => t.stop()); nativeStream = null; }
}
async function quaggaScan() {
  try { await loadQuagga(); } catch (e) { $('scanStatus').textContent = 'スキャナの読み込みに失敗しました。通信を確認してください。'; return; }
  if (!document.body.classList.contains('so')) return;
  $('preview').innerHTML = '';
  Quagga.init({
    inputStream: { name: 'Live', type: 'LiveStream', target: $('preview'),
      constraints: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'environment' }, area: { top: '20%', right: '5%', left: '5%', bottom: '20%' } },
    locator: { patchSize: 'medium', halfSample: true }, numOfWorkers: Math.min(navigator.hardwareConcurrency || 2, 4),
    frequency: 30, decoder: { readers: ['code_128_reader', 'ean_reader', 'code_39_reader'], multiple: false }, locate: true
  }, err => {
    if (err) { $('scanStatus').textContent = 'カメラの起動に失敗しました。権限を確認してください。'; return; }
    Quagga.start(); quaggaOk = true; trackExtras();
  });
  Quagga.offDetected();
  Quagga.onDetected(d => {
    if (!quaggaOk || !d.codeResult || !d.codeResult.code) return;
    const errs = (d.codeResult.decodedCodes || []).filter(c => c.error !== undefined).map(c => c.error);
    if (errs.length && errs.reduce((a, b) => a + b, 0) / errs.length > 0.12) return;
    found(d.codeResult.code);
  });
}
function track() { try { return nativeStream ? nativeStream.getVideoTracks()[0] : Quagga.CameraAccess.getActiveTrack(); } catch (e) { return null; } }
async function trackExtras() {
  const t = track();
  if (!t || !t.getCapabilities) return;
  const c = t.getCapabilities();
  try { if (c.focusMode && c.focusMode.includes('continuous')) await t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
  if (c.torch) $('torchBtn').style.display = 'block';
}
async function toggleTorch() {
  const t = track();
  if (!t) return;
  try { torchOn = !torchOn; await t.applyConstraints({ advanced: [{ torch: torchOn }] }); $('torchBtn').textContent = torchOn ? '💡 ライトOFF' : '💡 ライトON'; }
  catch (e) { torchOn = !torchOn; }
}
function stopScan() {
  scanSession++; stopNative();
  try { Quagga.stop(); Quagga.offDetected(); } catch (e) {}
  $('preview').innerHTML = ''; $('torchBtn').style.display = 'none'; $('torchBtn').textContent = '💡 ライトON';
  $('scan').style.display = 'none'; document.body.classList.remove('so'); quaggaOk = false;
}
</script>
